<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tailstech's World — a heavily modded Minecraft world built around exploration, engineering and enormous landscapes.">
    <title>Tailstech's World</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/images/favicon.ico">
</head>
<body>
    <main class="page">
        <h1 class="title">Tailstech's World</h1>
        <br>

        <span class="download-shadow">
        <a class="download-button" href="/downloads/TailstechsWorld.zip">
            <img
                class="download-image"
                src="/images/DownloadButton.png"
                alt=""
            >
            <span class="download-fallback">Download Modpack</span>
        </a>
        </span>

   


    <br>
    <br>
    <br>
    <br>


    <h2 class="text-overlay">How to install 
        <br> <span class="small-line">You will need: Curseforge, minecraft and to download the zip above,</span>



    </h2>


    <br>
    <br>
    <br>
    <br>

 </main>
    <footer>
        <p>Tailstech's World by Tailstechnology</p>
    </footer>
</body>

<script>
const button = document.querySelector('.download-button');
const image = button.querySelector('.download-image');
const fallback = button.querySelector('.download-fallback');

const normal = '/images/DownloadButton.png';
const hover = '/images/DownloadButtonHover.png';
const pressed = '/images/DownloadButtonClick.png';

button.addEventListener('mouseenter', () => {
    image.src = hover;
});

button.addEventListener('mouseleave', () => {
    image.src = normal;
});

button.addEventListener('mousedown', () => {
    image.src = pressed;
});

button.addEventListener('mouseup', () => {
    image.src = hover;
});

image.addEventListener('error', () => {
    image.style.display = 'none';
    fallback.style.display = 'inline-block';
});
</script>

</html>
